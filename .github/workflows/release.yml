name: Release (Bump Version & Deploy)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          # Use GITHUB_TOKEN to allow pushing back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run bump version script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure we are on the main branch as required by the script
          git checkout main

          # Make sure script is executable
          chmod +x script/bump-version.sh

          # Run the script
          ./script/bump-version.sh

      # This workflow only advances `prod`; it does not deploy. Deployment is
      # driven by whatever the operator points at that branch, and needs no
      # credentials here — this workflow uses ONLY GITHUB_TOKEN.
      #
      # Self-hosting: `prod` is the release pointer. Build the image from that
      # branch and roll it out however you like; a push made with GITHUB_TOKEN
      # does not spawn push-triggered workflows, so trigger your build from the
      # branch state rather than from a push event.
