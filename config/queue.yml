default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

# No `test:` block on purpose: the test environment is pinned to ActiveJob's `:test` adapter
# (config/environments/test.rb), so Solid Queue never runs there and dispatcher/worker settings
# for it could never take effect. Generator residue, removed rather than left as dead config.

production:
  <<: *default
